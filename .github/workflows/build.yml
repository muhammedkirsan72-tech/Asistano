name: APK derle
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: [app.zip]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Zip'i ac
        run: unzip -q app.zip -d proj
      - name: Derle
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Yuzen Asistan ${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
